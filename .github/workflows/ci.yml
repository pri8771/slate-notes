name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | sed 's/ *$//')
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator on runner"; xcrun simctl list devices; exit 1; fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -50

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult 2>&1 | tee -a build.log | tail -80

      - name: Surface the actual errors
        if: failure()
        run: |
          echo "--- error lines ---"
          grep -n -E "error:|Testing failed|failed with exit code|XCTAssert" build.log | head -60 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: TestResults.xcresult
          retention-days: 14
